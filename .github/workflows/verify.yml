name: Verify static converter
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run vendor:check
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - uses: actions/cache@v4
        with:
          path: .test-cache
          key: ffmpeg-core-${{ hashFiles('vendor/manifest.json') }}
      - run: node scripts/cache-core.cjs
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7
